;color:#6c48a0;font-weight:1000}.league-note{color:#877aa0;font-size:12px;font-weight:800}.league{margin:8px auto;max-width:335px;display:grid;gap:3px}.league-row{display:flex;justify-content:space-between;background:#f5ecfc;border-radius:10px;padding:5px 12px;font-size:15px;font-weight:850;color:#5c4980}.league-row.me{background:#ffe7a1;border:2px solid #ffbf53}.confetti{position:fixed;top:-50px;z-index:25;pointer-events:none;font-size:29px;animation:fallConfetti 2.3s ease-in forwards}@keyframes fallConfetti{to{transform:translateY(110vh) rotate(500deg);opacity:0}}@media(max-width:430px){#top{gap:5px;padding:8px 6px}.pill{padding:5px 7px;font-size:13px}#top .small-btn{width:38px;height:38px;font-size:19px}.dialog{padding:12px}.choice{min-height:62px}}@media(max-height:680px){.dialog{padding:9px}.question{margin:4px auto;min-height:52px}.choice{min-height:52px;padding:6px}.dialog h2{font-size:24px}}

/* Anblox v5: polished character studio, parental privacy gate and reports */

.parent-login-form{display:grid;gap:10px;margin:15px auto;max-width:360px;text-align:left}.parent-login-form label{font-weight:900;color:#63478f}.parent-login-form input{border-radius:14px;border:3px solid #c5afe9;padding:14px 12px;font-size:18px;max-width:100%;color:#423471;background:white}.parent-error{color:#bb2e58;font-weight:800;min-height:17px}.parent-time-range{border-radius:16px;background:#f5e8ff;padding:14px;font-size:14px;line-height:1.7;text-align:left}.missed-scroll{max-height:46vh}.incorrect-answer{color:#b33550;font-weight:900}.parent-table thead{position:sticky;top:0;background:#e9dbf8}.parent-table{font-variant-numeric:tabular-nums}.parent-scroll{border-radius:12px;border:1px solid #eadbed}

.style-curtain.left{left:0;clip-path:polygon(0 0,100% 0,75% 100%,0 100%)}.style-curtain.right{right:0;clip-path:polygon(0 0,100% 0,100% 100%,25% 100%)}

.style-tabs{grid-template-columns:repeat(5,minmax(0,1fr));gap:3px}.style-tabs .mini{font-size:clamp(9px,2.3vw,12px);padding:9px 2px;line-height:1.2;border-radius:13px}
